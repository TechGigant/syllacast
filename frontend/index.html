<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syllacast - Spotify Lyrics Display</title>
    <!-- Spicy Lyrics official font packs -->
    <link rel="stylesheet" href="https://fonts.spikerko.org/spicy-lyrics/source.css" />
    <link rel="stylesheet" href="https://fonts.spikerko.org/Vazirmatn/source.css" />
    <link rel="stylesheet" href="https://fonts.spikerko.org/NotoSansGeorgian/source.css" />
    <!-- Core styles -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="Fullscreen">
    <div id="app"></div>

    <!-- Settings overlay (Modal) -->
    <div id="settings-dialog" class="sl-card sl-glass--liquid" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; display: none; min-width: 320px; color: #fff; padding: 24px; border-radius: 16px; background: rgba(20,20,20,0.88); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 16px 40px rgba(0,0,0,0.6);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <h3 style="font-size: 1.15rem; font-weight: 700; margin: 0;">Settings & Diagnostics</h3>
        <button id="settings-close" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; line-height: 1;">✕</button>
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem;">
          <span>Calibration Offset</span>
          <span id="calib-ms" style="font-weight: 600;">0 ms</span>
        </label>
        <input type="range" id="calib-slider" min="-500" max="500" value="0" step="10" style="width: 100%; accent-color: #ff3366;" />
      </div>
      <div style="margin-bottom: 1.2rem;">
        <a id="open-full-settings-btn" href="/settings.html" class="settings-full-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Open Kiosk Settings</span>
          <span class="settings-full-btn__arrow">→</span>
        </a>
      </div>
      <div style="font-size: 0.82rem; color: rgba(255,255,255,0.65); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
        <div>Network RTT: <span id="diag-rtt" style="color: #fff; font-family: monospace;">0.0 ms</span></div>
        <div>Clock Offset: <span id="diag-offset" style="color: #fff; font-family: monospace;">0.0 ms</span></div>
        <div style="margin-top: 8px;">
          <a href="https://github.com/TechGigant/syllacast" target="_blank" style="color: #fff; text-decoration: underline; opacity: 0.85;">Syllacast AGPL-3.0 Source Code</a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
